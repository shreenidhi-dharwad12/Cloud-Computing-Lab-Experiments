services:

  patient-service:
    build: ./patient-service
    container_name: patient-service
    ports:
      - "5001:5001"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/patients/1')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  doctor-service:
    build: ./doctor-service
    container_name: doctor-service
    ports:
      - "5002:5002"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/doctors/1')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  appointment-service:
    build: ./appointment-service
    container_name: appointment-service
    ports:
      - "5003:5003"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/appointments/1')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  hospital-network:
    driver: bridge